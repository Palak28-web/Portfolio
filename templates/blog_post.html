{% extends "base.html" %}
{% block title %}{{ post.title }}{% endblock %}
{% block content %}
<div class="page">
  <a href="{{ url_for('blog') }}" class="back-link">&larr; all posts</a>

  <div class="post-date">{{ post.date }}</div>
  <h1 class="page-title">{{ post.title }}</h1>

  <div class="post-body" style="margin-top: 24px;">
    {% for para in post.body %}
    <p>{{ para }}</p>
    {% endfor %}
  </div>
</div>
{% endblock %}
